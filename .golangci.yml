version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused, plus a few that catch
  # mistakes an HTTP client is prone to.
  default: standard
  enable:
    - bodyclose
    - misspell
    - unconvert
    - usestdlibvars

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/datablock-dev/terraform-provider-cosmoner
